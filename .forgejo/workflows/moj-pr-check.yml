name: Moj merge preview (no image build)

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: moj-pr-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft }}
    runs-on: dmoj-docker
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the exact merge tree
        shell: bash
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for sha in "$PR_BASE_SHA" "$PR_HEAD_SHA"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid PR commit identity"; exit 1; }
            git cat-file -e "$sha^{commit}"
          done
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA" || { echo "Unexpected PR checkout"; exit 1; }
          if ! tree=$(git merge-tree --write-tree "$PR_BASE_SHA" "$PR_HEAD_SHA"); then
            printf '%s\n' "$tree"
            echo "Could not produce a clean merge preview"
            exit 1
          fi
          git diff --check "$PR_BASE_SHA" "$tree"
          printf 'Verified merge tree %s (base %s, head %s). No image built.\n' "$tree" "$PR_BASE_SHA" "$PR_HEAD_SHA"
